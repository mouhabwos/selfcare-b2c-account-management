version: '2'
services:
    selfcare-b2c-account-management-app:
        image: selfcare-b2c-account-management
        environment:
        # - _JAVA_OPTIONS=-Xmx512m -Xms256m
        - SPRING_PROFILES_ACTIVE=prod,swagger
        - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://admin:$${jhipster.registry.password}@jhipster-registry:8761/eureka
        - SPRING_CLOUD_CONFIG_URI=http://admin:$${jhipster.registry.password}@jhipster-registry:8761/config
        - SPRING_DATASOURCE_URL=jdbc:mysql://selfcare-b2c-account-management-mysql:3306/selfcare-b2c-account-management?useUnicode=true&characterEncoding=utf8&useSSL=false
        - JHIPSTER_SLEEP=30 # gives time for the JHipster Registry to boot before the application
        - SPRING_DATA_JEST_URI=http://selfcare-b2c-account-management-elasticsearch:9200
    selfcare-b2c-account-management-mysql:
        extends:
            file: mysql.yml
            service: selfcare-b2c-account-management-mysql
    selfcare-b2c-account-management-elasticsearch:
        extends:
            file: elasticsearch.yml
            service: selfcare-b2c-account-management-elasticsearch
    jhipster-registry:
        extends:
            file: jhipster-registry.yml
            service: jhipster-registry
        environment:
        - SPRING_CLOUD_CONFIG_SERVER_COMPOSITE_0_TYPE=native
        - SPRING_CLOUD_CONFIG_SERVER_COMPOSITE_0_SEARCH_LOCATIONS=file:./central-config/docker-config/
