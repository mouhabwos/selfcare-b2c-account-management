<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="#{email.activation.title}">JHipster creation</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link rel="shortcut icon" th:href="@{|${baseUrl}/favicon.ico|}" />
</head>
<body>
<p th:text="#{email.activation.greeting(${user.firstName})}">
    Dear
</p>
<p th:text="#{email.creation.text1}">
    Votre compte sur SelfCare a été créé, merci de cliquer sur le lien ci-dessous pour y accéder :
</p>
<p>
    <a th:with="url=(@{|${baseUrl}/#/reset/finish?key=${user.resetKey}|})" th:href="${url}"
       th:text="${url}">Login link</a>
</p>
<p>
    <span th:text="#{email.activation.text2}">Cordialement, </span>
    <br/>
    <em th:text="#{email.signature}">Le service Client.</em>
</p>
</body>
</html>
